<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRES Artist Finder</title>
<style>
  :root{
    --bg:#0e0e11; --card:#17171c; --card2:#1f1f26; --ink:#ececf1; --mut:#a3a3b1; --line:#2b2b35;
    --acc:#ff6a3d; --acc2:rgba(255,106,61,.14); --ok:#4cc38a; --okbg:rgba(76,195,138,.14); --warn:#f5b54a; --warnbg:rgba(245,181,74,.14);
    --grey:#8b8b99; --greybg:rgba(139,139,153,.14); --field:#121217; --r:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px 10px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:-.2px}
  h1 b{color:var(--acc)}
  .meta{color:var(--mut);font-size:12px;margin-left:auto}
  .btn{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--acc)}
  .btn.pri{background:var(--acc);color:#140904;border-color:var(--acc);font-weight:600}
  .search{flex:1;min-width:220px;display:flex;margin-top:10px}
  .search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--field);color:var(--ink)}
  .search input:focus{outline:2px solid var(--acc);border-color:transparent}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;user-select:none}
  .chip span{color:var(--mut);margin-left:4px;font-size:12px}
  .chip.on{background:var(--acc);color:#140904;border-color:var(--acc);font-weight:600}
  .chip.on span{color:#3a1a0d}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
  .count{color:var(--mut);font-size:13px;margin-left:auto}
  main{padding:16px 18px 110px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
  .card.sel{outline:2px solid var(--acc);border-color:transparent}
  .row1{display:flex;align-items:flex-start;gap:8px}
  .nm{font-weight:650;font-size:15px;line-height:1.25}
  .sub{color:var(--mut);font-size:12.5px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--acc2);color:var(--acc);white-space:nowrap}
  .pick{margin-left:auto;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1;flex:none}
  .card.sel .pick{background:var(--acc);color:#140904;border-color:var(--acc)}
  .facts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cost{font-weight:600;font-size:13px}
  .cost.none{color:var(--grey);font-weight:400}
  .st{font-size:11px;padding:2px 7px;border-radius:5px}
  .st.verified{background:var(--okbg);color:var(--ok)}
  .st.followup{background:var(--warnbg);color:var(--warn)}
  .st.nocost,.st.unverified{background:var(--greybg);color:var(--grey)}
  .rem{font-size:12px;color:var(--mut);border-left:2px solid var(--line);padding-left:7px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .acts .btn{padding:5px 9px;font-size:12.5px}
  .acts .btn.dim{color:var(--grey);pointer-events:none;border-style:dashed}
  .ph{font-size:12.5px;font-variant-numeric:tabular-nums}
  .empty,.loading{text-align:center;color:var(--mut);padding:60px 10px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#050507;border-top:1px solid var(--line);color:var(--ink);padding:12px 18px;display:none;align-items:center;gap:10px;z-index:9;flex-wrap:wrap}
  .bar.show{display:flex}
  .bar .btn{background:transparent;color:var(--ink);border-color:var(--line)}
  .bar .btn.pri{background:var(--acc);border-color:var(--acc)}
  .toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:10}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:30px 12px}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .sheet h2{margin:0 0 4px;font-size:17px}
  .sheet .hint{color:var(--mut);font-size:12px;margin:0 0 12px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.wide{grid-column:1/-1}
  .f label{font-size:12px;color:var(--mut)}
  .f label b{color:var(--ink);font-weight:600}
  .f input,.f textarea,.f select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;width:100%;background:var(--field);color:var(--ink)}
  .f textarea{min-height:60px;resize:vertical}
  .f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--acc);border-color:transparent}
  .f small{color:var(--grey);font-size:11px}
  .f small.tip{min-height:15px;display:block} 
  /* ---------- artist card v2 ---------- */
  .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));padding:14px;gap:10px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:#3a3a47}
  .head{display:flex;gap:12px;align-items:flex-start}
  .ph{width:64px;height:64px;border-radius:14px;flex:none;object-fit:cover;background:#26262f;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;letter-spacing:.5px;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph.zoom{cursor:zoom-in;transition:transform .15s,box-shadow .15s}
  .ph.zoom:hover{transform:scale(1.06);box-shadow:0 0 0 2px var(--acc)}
  .lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;cursor:zoom-out;backdrop-filter:blur(4px)}
  .lb.show{display:flex;animation:lbIn .18s ease-out}
  .lb img{max-width:min(92vw,560px);max-height:78vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain}
  .lb .cap{color:var(--ink);font-weight:650;font-size:16px;text-align:center}
  .lb .cap span{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
  .lb .x{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:20px;cursor:pointer}
  @keyframes lbIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .who{min-width:0;flex:1}
  .who .nm{font-size:16px;font-weight:650;line-height:1.25;color:var(--ink)}
  .who .sub{margin-top:2px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .pricebar{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:#111116;border:1px solid var(--line)}
  .price{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .price.none{font-size:13px;font-weight:500;color:var(--grey)}
  .pricebar .sub{text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bio{font-size:13px;line-height:1.45;color:#cfcfd8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bio.none{color:var(--grey);font-style:italic}
  .rows{display:flex;flex-direction:column;gap:5px;font-size:13px}
  .rowi{display:flex;gap:8px;align-items:center;min-width:0}
  .rowi .k{width:18px;text-align:center;flex:none;opacity:.85}
  .rowi .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowi a{color:var(--ink);text-decoration:none}
  .rowi a:hover{color:var(--acc)}
  .rowi .none{color:var(--grey)}
  .ports{display:flex;gap:6px;flex-wrap:wrap}
  .port{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#121217;color:var(--ink);text-decoration:none}
  .port:hover{border-color:var(--acc)}
  .port.off{opacity:.35;pointer-events:none}
  .port i{font-style:normal;font-weight:700;font-size:10px;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff}
  .acts{padding-top:2px}
  .rem{border-left-color:#3a3a47;color:var(--mut)}

  /* ---------- videos (last on the card) ---------- */
  .media{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#111116;margin-top:2px}
  .best{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000 center/cover no-repeat;cursor:pointer;border:0;padding:0}
  .best::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.78))}
  .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:54px;height:38px;border-radius:10px;background:#ff0033;display:grid;place-items:center;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .15s}
  .best:hover .play{transform:translate(-50%,-50%) scale(1.08)}
  .play::before{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .badge{position:absolute;top:8px;left:8px;z-index:1;background:#ffd34d;color:#3a2a00;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .ext{position:absolute;top:8px;right:8px;z-index:1;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;padding:3px 7px;border-radius:999px}
  .btitle{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;color:#fff;font-size:13px;font-weight:600;text-align:left;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .more{border-top:1px solid var(--line)}
  .more summary{list-style:none;cursor:pointer;padding:8px 10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;user-select:none;color:var(--ink)}
  .more summary::-webkit-details-marker{display:none}
  .more summary .arr{transition:transform .15s;color:var(--mut)}
  .more[open] summary .arr{transform:rotate(90deg)}
  .vlist{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px}
  .vrow{display:flex;gap:9px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
  .vrow:hover{border-color:var(--acc)}
  .vrow img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex:none;background:#26262f}
  .vrow span{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vrow small{display:block;color:var(--grey);font-size:10.5px;margin-top:2px}
  .links{display:flex;gap:6px;flex-wrap:wrap}
  .lk{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#121217;color:var(--ink);text-decoration:none}
  .lk:hover{border-color:var(--acc)}
  .lk i{font-style:normal;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
  .vpop{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:31;padding:16px}
  .vpop.show{display:flex}
  .vbox{width:min(920px,100%);background:#000;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid var(--line)}
  .vbox .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card)}
  .vbar .t{flex:1;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* space reserved so buttons don't jump */
  .f.bad input{border-color:#ff6b6b}
  .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
  .msg{font-size:13px;padding:9px 11px;border-radius:8px;margin-top:12px;display:none}
  .msg.show{display:block}
  .msg.warn{background:var(--warnbg);color:var(--warn)}
  .msg.err{background:rgba(255,90,90,.14);color:#ff8a80}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .msg a{color:inherit;font-weight:600}
  .card.new{animation:pulse 2.2s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
  @media (max-width:600px){.fgrid{grid-template-columns:1fr}}
  @media (max-width:600px){header{padding:12px;position:static}main{padding:12px 12px 120px}.meta{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><b>CRES</b> Artist Finder</h1>
    <span class="meta" id="meta"></span>
    <button class="btn pri" id="addBtn">+ Add artist</button>
    <button class="btn" id="refresh" title="Reload latest data from the sheet">↻ Refresh</button>
    <a class="btn" id="openSheet" target="_blank">Open sheet ↗</a>
  </div>
  <div class="search"><input id="q" placeholder="Search name, band, city, act type, remarks…" autocomplete="off"></div>
  <div class="chips" id="cats"></div>
  <div class="filters">
    <select id="city"><option value="">All cities</option></select>
    <select id="budget">
      <option value="">Any budget</option>
      <option value="0-25000">Up to ₹25K</option>
      <option value="25000-50000">₹25K – 50K</option>
      <option value="50000-100000">₹50K – 1L</option>
      <option value="100000-1e12">₹1L +</option>
      <option value="none">Cost not set</option>
    </select>
    <select id="status">
      <option value="">Any status</option>
      <option value="verified">✓ Cost updated 2026</option>
      <option value="followup">Needs follow-up</option>
      <option value="unverified">Cost given, not dated</option>
      <option value="nocost">No cost / no remark</option>
    </select>
    <select id="has">
      <option value="">Phone / link: any</option>
      <option value="phone">Has phone</option>
      <option value="link">Has profile link</option>
      <option value="photo">Has photo</option>
      <option value="video">Has video</option>
      <option value="nophoto">No photo yet</option>
    </select>
    <select id="sort">
      <option value="sheet">Sheet order</option>
      <option value="name">Name A–Z</option>
      <option value="costAsc">Cost low → high</option>
      <option value="costDesc">Cost high → low</option>
    </select>
    <button class="btn" id="reset">Clear filters</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div class="loading" id="loading">Loading artists from the sheet…</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No matches. Try clearing the filters.</div>
</main>

<div class="bar" id="bar">
  <b id="selN">0</b> shortlisted
  <button class="btn pri" id="copyWa">Copy for WhatsApp / mail</button>
  <button class="btn" id="copyInt">Copy with contacts (internal)</button>
  <button class="btn" id="showSel">Show only shortlist</button>
  <button class="btn" id="clearSel">Clear</button>
</div>
<div class="toast" id="toast"></div>
<div class="vpop" id="vpop" role="dialog" aria-label="Video"><div class="vbox"><div class="frame"><iframe id="vframe" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="vbar"><span class="t" id="vtitle"></span><button class="btn" id="vclose">Close ✕</button></div></div></div>
<div class="lb" id="lb" role="dialog" aria-label="Artist photo"><button class="x" id="lbX" aria-label="Close">×</button><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>

<div class="modal" id="addModal">
  <form class="sheet" id="addForm" autocomplete="off">
    <h2 id="addTitle">Add new artist</h2>
    <p class="hint" id="addHint">Pick a category — the form adapts to that tab's columns. The entry is added below the last artist in that tab.</p>
    <div class="f wide"><label><b>Category / Tab</b></label><select id="fCat" required></select></div>
    <div class="fgrid" id="fFields" style="margin-top:10px"></div>
    <div class="msg" id="addMsg"></div>
    <div class="mact">
      <a class="btn" id="editSheetLink" target="_blank" style="display:none;margin-right:auto">Open in sheet ↗</a>
      <button type="button" class="btn" id="addCancel">Cancel</button>
      <button type="button" class="btn" id="addForce" style="display:none">Yes, add anyway</button>
      <button type="submit" class="btn pri" id="addSave">Save to sheet</button>
    </div>
  </form>
</div>

<script>
let ALL = [], SHEET_URL = '', CAT = '', ONLY_SEL = false, JUST_ADDED = '';
const THUMBS = {};      // photoId -> data URL (loaded from the script as cards come on screen)
let SEL = new Set();
try { SEL = new Set(JSON.parse(localStorage.getItem('cresShortlist') || '[]')); } catch (e) {}
const $ = id => document.getElementById(id);
// 1 -> A, 4 -> D, 27 -> AA
const colLetter = n => { let s = ''; n = n || 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
// Sheet link that opens straight at that cell (e.g. Standup!D133)
// "919820123456" -> "98201 23456",  "971501234567" -> "+971501234567"
const showPhone = p => /^91\d{10}$/.test(p) ? p.slice(2, 7) + ' ' + p.slice(7) : '+' + p;
const cellLink = (gid, row, col) => SHEET_URL.split('#')[0].replace(/\?.*$/, '') + '#gid=' + gid + '&range=' + colLetter(col) + row;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Last loaded data is kept on this device so the portal shows instantly next time,
// then fresh data from the sheet replaces it a moment later.
const LOCAL_KEY = 'cresArtistsCache_v2';
let FIRST_PAINT = true;

function applyData(res, fromDevice) {
  ALL = res.artists; SHEET_URL = res.sheetUrl;
  $('openSheet').href = SHEET_URL;
  const t = new Date(res.loadedAt).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  $('meta').textContent = (res.sheetName ? res.sheetName + ' · ' : '')
    + (fromDevice ? 'updating… (showing ' + t + ')' : 'updated ' + t)
    + (res.missingTabs && res.missingTabs.length ? ' · ⚠ tab not found: ' + res.missingTabs.join(', ') : '');
  $('loading').style.display = 'none';
  buildFilters(); render();
  if (FIRST_PAINT) {
    FIRST_PAINT = false;
    // Tell the installable app (GitHub Pages wrapper) that data is on screen
    try { window.top.postMessage({ cres: 'artist-finder-ready' }, '*'); } catch (e) {}
    // Warm up the Add-artist form in the background so it opens instantly
    setTimeout(() => { if (!SCHEMA) google.script.run.withSuccessHandler(s => { if (!SCHEMA) SCHEMA = s; }).getFormSchema(); }, 1500);
  }
}

function load(force) {
  if (!ALL.length) {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
    if (saved && saved.artists) applyData(saved, true);
    else $('loading').style.display = 'block';
  } else {
    $('meta').textContent = 'Refreshing…';
  }
  google.script.run
    .withSuccessHandler(res => {
      applyData(res, false);
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(res)); } catch (e) {}
    })
    .withFailureHandler(err => {
      if (ALL.length) $('meta').textContent = 'Could not refresh: ' + err.message;
      else $('loading').textContent = 'Could not load: ' + err.message;
    })
    .getArtists(!!force);
}

function buildFilters() {
  const cats = {};
  ALL.forEach(a => cats[a.cat] = (cats[a.cat] || 0) + 1);
  $('cats').innerHTML = ['<span class="chip' + (CAT ? '' : ' on') + '" data-c="">All<span>' + ALL.length + '</span></span>']
    .concat(Object.keys(cats).map(c => '<span class="chip' + (CAT === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '<span>' + cats[c] + '</span></span>')).join('');
  const cities = {};
  ALL.forEach(a => a.cities.forEach(c => cities[c] = (cities[c] || 0) + 1));
  const cur = $('city').value;
  $('city').innerHTML = '<option value="">All cities</option>' + Object.keys(cities)
    .sort((a, b) => cities[b] - cities[a]).map(c => '<option>' + esc(c) + '</option>').join('')
    + '<option value="__none">City not set</option>';
  $('city').value = cur;
}

const fmtK = n => n >= 100000 ? (n / 100000).toFixed(n % 100000 ? 1 : 0) + 'L' : Math.round(n / 1000) + 'K';
const costLabel = a => a.costMin == null ? '' : '₹' + (a.costMin === a.costMax ? fmtK(a.costMin) : fmtK(a.costMin) + '–' + fmtK(a.costMax));
const STATUS = { verified: '✓ Updated 2026', followup: 'Follow-up', unverified: 'Not dated', nocost: 'No info' };

function filtered() {
  const q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const city = $('city').value, bud = $('budget').value, st = $('status').value, has = $('has').value;
  let list = ALL.filter(a => {
    if (ONLY_SEL && !SEL.has(a.id)) return false;
    if (CAT && a.cat !== CAT) return false;
    if (city === '__none' ? a.cities.length : city && a.cities.indexOf(city) < 0) return false;
    if (st && a.status !== st) return false;
    if (has === 'phone' && !a.phones.length && !a.managerPhones.length) return false;
    if (has === 'link' && !a.link) return false;
    if (has === 'photo' && !(a.photo || a.photoId)) return false;
    if (has === 'video' && !(a.videos && a.videos.length)) return false;
    if (has === 'nophoto' && (a.photo || a.photoId)) return false;
    if (bud === 'none') { if (a.costMin != null) return false; }
    else if (bud) {
      const [lo, hi] = bud.split('-').map(Number);
      if (a.costMin == null || a.costMin > hi || a.costMax < lo) return false;
    }
    if (q.length) {
      const hay = [a.name, a.company, a.city, a.type, a.language, a.cat, a.remarks, a.costRaw, a.extra, a.phoneRaw, a.managerRaw, a.email, a.bio, (a.videos || []).map(v => v.title).join(' ')].join(' ').toLowerCase();
      if (!q.every(w => hay.indexOf(w) >= 0)) return false;
    }
    return true;
  });
  const s = $('sort').value;
  const big = 1e15;
  if (s === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  if (s === 'costAsc') list.sort((a, b) => (a.costMin ?? big) - (b.costMin ?? big));
  if (s === 'costDesc') list.sort((a, b) => (b.costMax ?? -1) - (a.costMax ?? -1));
  return list;
}

function linkBtn(a) {
  if (!a.link) return '<span class="btn dim">No profile</span>';
  const label = { slides: 'Profile slide', instagram: 'Instagram', youtube: 'YouTube', web: 'Link' }[a.linkType];
  return '<a class="btn" target="_blank" href="' + esc(a.link) + '">' + label + ' ↗</a>';
}

// Initials avatar colour, stable per name
function avatarBg(name) {
  let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return 'linear-gradient(135deg,hsl(' + h + ',62%,42%),hsl(' + ((h + 40) % 360) + ',70%,30%))';
}
function initials(name) {
  return String(name).replace(/[^A-Za-z\s]/g, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '★';
}
function port(label, badge, color, url) {
  return '<a class="port' + (url ? '' : ' off') + '"' + (url ? ' target="_blank" rel="noopener" href="' + esc(url) + '"' : '') + '>'
    + '<i style="background:' + color + '">' + badge + '</i>' + label + '</a>';
}

const ytThumb = (id, q) => 'https://i.ytimg.com/vi/' + id + '/' + (q || 'hqdefault') + '.jpg';

function videoBlock(a) {
  const vids = a.videos || [];
  if (!vids.length) return '';
  const best = vids[a.best >= 0 ? a.best : 0];
  const rest = vids.filter(v => v !== best);
  return '<div class="media">'
    + '<button class="best" data-play="' + a.id + '|' + best.id + '" style="background-image:url(' + ytThumb(best.id) + ')">'
    +   '<span class="badge">★ Best work</span>' + (best.embed ? '' : '<span class="ext">opens YouTube</span>')
    +   '<span class="play"></span><span class="btitle">' + esc(best.title) + '</span></button>'
    + (rest.length ? '<details class="more"><summary><span class="arr">▸</span> More videos (' + rest.length + ')</summary><div class="vlist">'
      + rest.map(v => '<button class="vrow" data-play="' + a.id + '|' + v.id + '"><img loading="lazy" src="' + ytThumb(v.id, 'mqdefault') + '" alt=""><span>' + esc(v.title)
        + (v.embed ? '' : '<small>opens YouTube</small>') + '</span></button>').join('')
      + '</div></details>' : '')

function card(a) {
  const sub = [a.company, a.type, a.language].filter(Boolean).map(esc).join(' · ');
  const phone = a.phones[0] || a.managerPhones[0];
  const sheetLink = cellLink(a.gid, a.row, a.nameCol);
  const photo = a.photo || a.photoId
    ? '<div class="ph zoom" data-zoom="' + a.id + '" data-pid="' + esc(a.photoId || '') + '" title="Click to enlarge" style="background:' + avatarBg(a.name) + '" data-ini="' + esc(initials(a.name)) + '">'
      + (a.photo || THUMBS[a.photoId] ? '<img src="' + esc(a.photo || THUMBS[a.photoId]) + '" alt="' + esc(a.name) + '" onerror="photoFailed(this)">' : esc(initials(a.name)))

  const links = (a.channel ? '<a class="lk" target="_blank" rel="noopener" href="' + esc(a.channel) + '"><i style="background:#ff0033">▶</i>YouTube channel</a>' : '')

    // 2. cost (+ bio when there is one)

    + '<div class="rows">'
    +   '<div class="rowi"><span class="k">📞</span><span class="v">' + (phone ? '<a href="tel:+' + phone + '">' + showPhone(phone) + '</a>' + (a.phones[0] ? '' : ' <span class="sub">(manager)</span>') : '<span class="none">No number</span>') + '</span></div>'
    +   '<div class="rowi"><span class="k">👤</span><span class="v" title="' + esc(a.managerRaw) + '">' + (managerTxt || '<span class="none">No manager added</span>') + '</span></div>'
    +   '<div class="rowi"><span class="k">✉️</span><span class="v">' + (a.email ? '<a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a>' : '<span class="none">No email added</span>') + '</span></div>'

    +   '<a class="btn" target="_blank" href="' + esc(sheetLink) + '" title="Open this artist in the sheet">Sheet ↗</a>'

    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1600); }

function copy(text) {
  const done = () => toast('Copied ✓');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
}

function shortlistText(internal) {
  const picked = ALL.filter(a => SEL.has(a.id));
  const groups = {};
  picked.forEach(a => (groups[a.cat] = groups[a.cat] || []).push(a));
  let out = [];
  Object.keys(groups).forEach(cat => {
    out.push('*' + cat + '*');
    groups[cat].forEach((a, i) => {
      let line = (i + 1) + '. ' + a.name + (a.city ? ' (' + a.city + ')' : '');
      if (internal) line += (a.costRaw ? ' — ' + a.costRaw : '') + (a.phones[0] || a.managerPhones[0] ? ' — ' + showPhone(a.phones[0] || a.managerPhones[0]) : '');
      if (a.link) line += '\n   ' + a.link;
      out.push(line);
    });
    out.push('');
  });
  return out.join('\n').trim();
}

/* Same rule as checkPhone_ in Code.gs — if you change one, change both */
function checkPhone_(raw) {
  const s = String(raw || '').trim();
  if (!s) return { ok: false, err: 'Number is empty' };
  if (/[a-z]/i.test(s)) return { ok: false, err: 'Number cannot contain letters' };
  const plus = /^\s*(\+|00)/.test(s);
  let d = s.replace(/\D/g, '');
  if (/^00/.test(s.trim())) d = d.slice(2);
  const dummy = x => /^(\d)\1+$/.test(x) || ['0123456789', '1234567890', '9876543210', '0987654321'].indexOf(x) >= 0;

  // Indian
  let ind = null;
  if (plus && /^91\d{10}$/.test(d)) ind = d.slice(2);
  else if (!plus && /^\d{10}$/.test(d)) ind = d;
  else if (!plus && /^0\d{10}$/.test(d)) ind = d.slice(1);
  else if (!plus && /^91\d{10}$/.test(d)) ind = d.slice(2);
  if (ind !== null) {
    if (!/^[6-9]/.test(ind)) return { ok: false, err: 'Indian mobile numbers start with 6, 7, 8 or 9' };
    if (dummy(ind)) return { ok: false, err: 'This looks like a dummy number' };
    return { ok: true, digits: '91' + ind, pretty: ind.slice(0, 5) + ' ' + ind.slice(5) };
  }
  if (plus && /^91/.test(d)) return { ok: false, err: '+91 must be followed by exactly 10 digits' };
  // International
  if (plus) {
    if (d.length < 8 || d.length > 15) return { ok: false, err: 'International numbers need 8–15 digits including country code' };
    if (/^(\d)\1+$/.test(d.slice(-8))) return { ok: false, err: 'This looks like a dummy number' };
    return { ok: true, digits: d, pretty: '+' + d };
  }
  return { ok: false, err: 'Indian numbers have 10 digits. For a number outside India, start with + and the country code (e.g. +971…)' };
}

/** Check one field and show a small message under it. Returns error text or '' */
function checkField(k) {
  const el = $('in_' + k); if (!el) return '';
  const box = el.parentElement, v = el.value.trim();
  let tip = box.querySelector('.tip');
  if (!tip) { tip = document.createElement('small'); tip.className = 'tip'; box.appendChild(tip); }
  box.classList.remove('bad'); tip.textContent = ''; tip.style.color = '';
  if (!v) return '';
  if (MODE === 'edit' && EDITING && EDITING.raw && v === String(EDITING.raw[k] || '').trim()) return '';   // unchanged old value
  let err = '', ok = '';
  if (k === 'phone' || k === 'phone2') {
    const r = checkPhone_(v); if (r.ok) ok = '✓ Will be saved as: ' + r.pretty; else err = r.err;
  } else if (k === 'manager') {
    for (const n of (v.match(/\+?\d[\d\s\-().]*\d/g) || [])) {
      if (n.replace(/\D/g, '').length < 4) continue;
      const r = checkPhone_(n); if (!r.ok) { err = r.err; break; }
    }
  } else if (k === 'email') {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) err = 'Email looks wrong (e.g. name@example.com)';
  } else if (k === 'city') {
    const opts = [...document.querySelectorAll('#dl_city option')].map(o => o.value.toLowerCase());
    if (opts.length && opts.indexOf(v.toLowerCase()) < 0) ok = '＋ New city — it will be added to the sheet (spelling/format is cleaned automatically, e.g. "banglore" → Bangalore)';
  }
  if (err) { box.classList.add('bad'); tip.textContent = '✕ ' + err; tip.style.color = '#ff8a80'; }
  else if (ok) { tip.textContent = ok; tip.style.color = k === 'city' ? 'var(--warn)' : 'var(--ok)'; }
  return err;
}

function validate(data) {
  if (!data.name && !data.company) return 'Enter a Name or Company/Band.';
  for (const k of ['phone', 'phone2', 'manager', 'email']) {
    const e = checkField(k);
    if (e) { $('in_' + k).focus(); return ({ phone: 'Contact number', phone2: 'Second number', manager: 'Manager number', email: 'Email' })[k] + ': ' + e; }
  }
  return '';
}

function resetMsg() { $('addMsg').className = 'msg'; $('addForce').style.display = 'none'; $('addSave').disabled = false; }
function showMsg(type, html) { $('addMsg').className = 'msg show ' + type; $('addMsg').innerHTML = html; }

function saveEdit() {
  const data = collect();
  const err = validate(data);
  if (err) return showMsg('err', err);
  const a = EDITING;
  $('addSave').disabled = true;
  showMsg('warn', 'Saving changes…');
  google.script.run
    .withSuccessHandler(res => {
      $('addSave').disabled = false;
      if (res.unchanged) { showMsg('ok', 'Nothing changed.'); return; }
      showMsg('ok', '✓ Saved ' + res.changed + ' change' + (res.changed > 1 ? 's' : '') + ' · <a target="_blank" href="' + esc(cellLink(res.gid, res.row, res.nameCol)) + '">Open in sheet ↗</a>');
      JUST_ADDED = res.gid + '-' + res.row;
      setTimeout(closeAdd, 900);
      load(true);
    })
    .withFailureHandler(e => { $('addSave').disabled = false; showMsg('err', 'Could not save: ' + esc(e.message)); })
    .updateArtist({ cat: a.cat, row: a.row, origName: (a.raw && (a.raw.name || a.raw.company)) || a.name, data: data });
}

function save(force) {
  if (MODE === 'edit') return saveEdit();
  const data = collect();
  const err = validate(data);
  if (err) return showMsg('err', err);
  $('addSave').disabled = true; $('addForce').style.display = 'none';
  showMsg('warn', 'Saving to sheet…');
  const cat = $('fCat').value;
  google.script.run
    .withSuccessHandler(res => {
      $('addSave').disabled = false;
      if (res.duplicate) {
        showMsg('warn', '<b>' + esc(data.name || data.company) + '</b> already exists in this tab (row ' + res.row + '). '
          + '<a target="_blank" href="' + esc(cellLink(res.gid, res.row, res.nameCol)) + '">View ↗</a>. Add anyway?');
        $('addForce').style.display = '';
        return;
      }
      const url = cellLink(res.gid, res.row, res.nameCol);
      showMsg('ok', '✓ Added to <b>' + esc(res.tab) + '</b>, row ' + res.row + (res.srno ? ' (Sr ' + res.srno + ')' : '')
        + ' · <a target="_blank" href="' + esc(url) + '">Open in sheet ↗</a>');
      document.querySelectorAll('#fFields [data-k]').forEach(el => el.value = '');
      JUST_ADDED = res.gid + '-' + res.row;
      SCHEMA = null; // reload next time so new city/type suggestions show up
      CAT = cat; $('q').value = data.name || data.company;
      load(true);
    })
    .withFailureHandler(e => { $('addSave').disabled = false; showMsg('err', 'Could not save: ' + esc(e.message)); })
    .addArtist({ cat: cat, data: data, force: !!force });
}

$('addBtn').onclick = openAdd;
$('addCancel').onclick = closeAdd;
$('addModal').addEventListener('click', e => { if (e.target === $('addModal')) closeAdd(); });
$('fCat').addEventListener('change', () => { resetMsg(); fillFields(); });
// Typing anything clears the old red error at the bottom
$('fFields').addEventListener('input', () => { if ($('addMsg').classList.contains('err')) resetMsg(); });
$('addForm').addEventListener('submit', e => { e.preventDefault(); save(false); });
$('addForce').onclick = () => save(true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdd(); });

/* ===================== PHOTO ZOOM ===================== */
// If a Drive photo can't load (not signed in, blocked cookies), show the initials instead of a broken image
function photoFailed(img) {
  const box = img.parentElement; if (!box) return;
  box.classList.remove('zoom'); box.removeAttribute('data-zoom'); box.removeAttribute('title');
  box.textContent = box.dataset.ini || '';
}
/* Load thumbnails for cards that are on screen, 40 at a time */
let PHOTO_Q = [], PHOTO_BUSY = false, PHOTO_OBS = null;
function wantPhoto(pid) { if (pid && !(pid in THUMBS) && PHOTO_Q.indexOf(pid) < 0) PHOTO_Q.push(pid); pumpPhotos(); }
function pumpPhotos() {
  if (PHOTO_BUSY || !PHOTO_Q.length) return;
  PHOTO_BUSY = true;
  const batch = PHOTO_Q.splice(0, 40);
  google.script.run
    .withSuccessHandler(map => {
      Object.keys(map || {}).forEach(pid => {
        THUMBS[pid] = map[pid] || '';
        document.querySelectorAll('.ph[data-pid="' + pid + '"]').forEach(box => {
          if (map[pid]) { box.innerHTML = ''; const im = new Image(); im.alt = ''; im.onerror = () => photoFailed(im); im.src = map[pid]; box.appendChild(im); }
          else photoFailed({ parentElement: box });
        });
      });
      PHOTO_BUSY = false; pumpPhotos();
    })
    .withFailureHandler(() => { batch.forEach(pid => THUMBS[pid] = ''); PHOTO_BUSY = false; pumpPhotos(); })
    .getThumbs(batch);
}
function watchPhotos() {
  if (!PHOTO_OBS && 'IntersectionObserver' in window) {
    PHOTO_OBS = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { PHOTO_OBS.unobserve(e.target); wantPhoto(e.target.dataset.pid); } }), { rootMargin: '400px' });
  }
  document.querySelectorAll('.ph[data-pid]').forEach(box => {
    const pid = box.dataset.pid; if (!pid || pid in THUMBS) return;
    if (PHOTO_OBS) PHOTO_OBS.observe(box); else wantPhoto(pid);
  });
}

function openPhoto(a) {
  $('lbImg').src = a.photoLarge || a.photo || THUMBS[a.photoId] || '';
  if (a.photoId && !a.photoLarge) {
    google.script.run.withSuccessHandler(url => { if (url) { a.photoLarge = url; if ($('lb').classList.contains('show')) $('lbImg').src = url; } }).getPhotoLarge(a.photoId);
  }
  $('lbCap').innerHTML = esc(a.name) + '<span>' + esc([a.cat, a.city].filter(Boolean).join(' · ')) + '</span>';
  $('lb').classList.add('show');
}
function closePhoto() { $('lb').classList.remove('show'); }
function playVideo(a, vid) {
  const v = (a.videos || []).find(x => x.id === vid); if (!v) return;
  if (!v.embed) { window.open('https://www.youtube.com/watch?v=' + v.id, '_blank'); return; }   // owner blocked playing outside YouTube
  $('vframe').src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&rel=0&playsinline=1';
  $('vtitle').textContent = a.name + ' · ' + v.title;
  $('vpop').classList.add('show');
}
function closeVideo() { $('vpop').classList.remove('show'); $('vframe').src = ''; }
$('vclose').onclick = closeVideo;
$('vpop').addEventListener('click', e => { if (e.target === $('vpop')) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });

$('grid').addEventListener('click', e => {
  const pl = e.target.closest('[data-play]');
  if (pl) { const [aid, vid] = pl.dataset.play.split('|'); const a = ALL.find(x => x.id === aid); if (a) playVideo(a, vid); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { const a = ALL.find(x => x.id === ed.dataset.edit); if (a) openEdit(a); return; }
  const z = e.target.closest('[data-zoom]'); if (!z) return;
  const a = ALL.find(x => x.id === z.dataset.zoom); if (a && (a.photo || THUMBS[a.photoId])) openPhoto(a);
});
$('lb').addEventListener('click', closePhoto);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePhoto(); });

load();
</script>
